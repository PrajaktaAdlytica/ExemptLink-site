<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" role="img" aria-label="Scope before records"><title>Scope before records</title><desc>One state, one offer and a named owner assemble a proposed scope brief.</desc><style>
text{font-family:"Instrument Sans",Arial,sans-serif;fill:#263B36}.title{font-size:22px;font-weight:600;letter-spacing:-.5px}.label{font-size:14px;font-weight:600}.small{font-size:12px;fill:#5D6C65}.data{font-size:17px;font-variant-numeric:tabular-nums}.line{fill:none;stroke:#32776B;stroke-width:2;stroke-linecap:round}.trace{stroke-dasharray:900;stroke-dashoffset:0;animation:trace 1.8s cubic-bezier(.22,1,.36,1) both}.settle{animation:settle .7s cubic-bezier(.22,1,.36,1) both}.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}.d4{animation-delay:.6s}.emphasize{animation:emphasis 1.2s ease both}.bar{transform-box:fill-box;transform-origin:left center;animation:bar .8s ease both}@keyframes trace{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}@keyframes settle{from{transform:translateY(14px)}to{transform:translateY(0)}}@keyframes emphasis{from{stroke-width:0}to{stroke-width:2}}@keyframes bar{from{transform:scaleX(.08)}to{transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><text x="34" y="42" class="title">Scope before records</text><text x="34" y="66" class="small">DEMO / ILLUSTRATIVE · concept preview</text><g class="settle d2"><rect x="370" y="113" width="439" height="282" rx="10" fill="#FFF" stroke="#D5DED7"/><text x="390" y="147" class="label">Proposed scope brief</text><text x="390" y="176" class="small">One state / one workflow</text><text x="390" y="201" class="small">Named owner / contact permission</text><text x="390" y="226" class="small">No raw records in public intake</text></g><g class="settle d0"><rect x="43" y="120" width="230" height="67" rx="10" fill="#FFF" stroke="#D5DED7"/><text x="63" y="154" class="label">State</text><text x="63" y="183" class="small">Scope selection</text></g><g class="settle d1"><rect x="43" y="203" width="230" height="67" rx="10" fill="#FFF" stroke="#D5DED7"/><text x="63" y="237" class="label">Offer</text><text x="63" y="266" class="small">Scope selection</text></g><g class="settle d2"><rect x="43" y="286" width="230" height="67" rx="10" fill="#FFF" stroke="#D5DED7"/><text x="63" y="320" class="label">Owner</text><text x="63" y="349" class="small">Scope selection</text></g></svg>
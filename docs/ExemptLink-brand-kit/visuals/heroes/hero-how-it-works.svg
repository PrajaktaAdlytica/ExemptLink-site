<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" role="img" aria-label="A reviewed evidence loop"><title>A reviewed evidence loop</title><desc>Scope → link → review → proposed action → preserve. Human decisions gate the loop.</desc><style>
text{font-family:"Instrument Sans",Arial,sans-serif;fill:#263B36}.title{font-size:22px;font-weight:600;letter-spacing:-.5px}.label{font-size:14px;font-weight:600}.small{font-size:12px;fill:#5D6C65}.data{font-size:17px;font-variant-numeric:tabular-nums}.line{fill:none;stroke:#32776B;stroke-width:2;stroke-linecap:round}.trace{stroke-dasharray:900;stroke-dashoffset:0;animation:trace 1.8s cubic-bezier(.22,1,.36,1) both}.settle{animation:settle .7s cubic-bezier(.22,1,.36,1) both}.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}.d4{animation-delay:.6s}.emphasize{animation:emphasis 1.2s ease both}.bar{transform-box:fill-box;transform-origin:left center;animation:bar .8s ease both}@keyframes trace{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}@keyframes settle{from{transform:translateY(14px)}to{transform:translateY(0)}}@keyframes emphasis{from{stroke-width:0}to{stroke-width:2}}@keyframes bar{from{transform:scaleX(.08)}to{transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><text x="34" y="42" class="title">A reviewed evidence loop</text><text x="34" y="66" class="small">DEMO / ILLUSTRATIVE · concept preview</text><path d="M85 221H798" class="line trace"/><circle cx="85" cy="221" r="28" fill="#245B50" class="settle d0"/><text x="76" y="228" class="label" style="fill:#FFF">01</text><text x="51" y="289" class="label">Scope</text><circle cx="263" cy="221" r="28" fill="#245B50" class="settle d1"/><text x="254" y="228" class="label" style="fill:#FFF">02</text><text x="229" y="289" class="label">Link</text><circle cx="441" cy="221" r="28" fill="#B97A50" class="settle d2"/><text x="432" y="228" class="label" style="fill:#FFF">03</text><text x="407" y="289" class="label">Review</text><circle cx="619" cy="221" r="28" fill="#245B50" class="settle d3"/><text x="610" y="228" class="label" style="fill:#FFF">04</text><text x="585" y="289" class="label">Propose action</text><circle cx="797" cy="221" r="28" fill="#245B50" class="settle d4"/><text x="788" y="228" class="label" style="fill:#FFF">05</text><text x="763" y="289" class="label">Preserve</text><g class="settle"><rect x="292" y="340" width="310" height="83" rx="10" fill="#FFF" stroke="#D5DED7"/><text x="312" y="374" class="label">Human decision boundary</text><text x="312" y="403" class="small">Tax owner approves proposed next steps.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" role="img" aria-label="A decision has a boundary"><title>A decision has a boundary</title><desc>Read, suggest and review remain inside the permission boundary; external action is gated.</desc><style>
text{font-family:"Instrument Sans",Arial,sans-serif;fill:#263B36}.title{font-size:22px;font-weight:600;letter-spacing:-.5px}.label{font-size:14px;font-weight:600}.small{font-size:12px;fill:#5D6C65}.data{font-size:17px;font-variant-numeric:tabular-nums}.line{fill:none;stroke:#32776B;stroke-width:2;stroke-linecap:round}.trace{stroke-dasharray:900;stroke-dashoffset:0;animation:trace 1.8s cubic-bezier(.22,1,.36,1) both}.settle{animation:settle .7s cubic-bezier(.22,1,.36,1) both}.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}.d4{animation-delay:.6s}.emphasize{animation:emphasis 1.2s ease both}.bar{transform-box:fill-box;transform-origin:left center;animation:bar .8s ease both}@keyframes trace{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}@keyframes settle{from{transform:translateY(14px)}to{transform:translateY(0)}}@keyframes emphasis{from{stroke-width:0}to{stroke-width:2}}@keyframes bar{from{transform:scaleX(.08)}to{transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><rect width="880" height="480" fill="#162C27"/><text x="34" y="42" class="title" style="fill:#FFF">A decision has a boundary</text><text x="34" y="66" class="small" style="fill:#CDD9D1">PROPOSED CONTROLS · concept preview</text><rect x="42" y="126" width="575" height="270" rx="12" fill="none" stroke="#CDD9D1" stroke-width="1" class="emphasize"/><text x="71" y="173" class="label" style="fill:#FFF">Read</text><text x="223" y="173" class="small" style="fill:#CDD9D1">Permissioned exports</text><text x="71" y="248" class="label" style="fill:#FFF">Suggest</text><text x="223" y="248" class="small" style="fill:#CDD9D1">Reviewable evidence</text><text x="71" y="323" class="label" style="fill:#FFF">Review</text><text x="223" y="323" class="small" style="fill:#CDD9D1">Named tax owner</text><path d="M617 261h44" stroke="#CDD9D1" stroke-width="2" class="trace"/><path d="M660 228v66M674 228v66" stroke="#B97A50" stroke-width="3"/><text x="696" y="252" class="label" style="fill:#FFF">External action</text><text x="696" y="279" class="small" style="fill:#CDD9D1">Separate approval</text></svg>
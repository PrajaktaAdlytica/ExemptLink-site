<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" role="img" aria-label="A draft awaits its owner"><title>A draft awaits its owner</title><desc>An exception opens a source-specific request draft; the approval gate holds the send action.</desc><style>
text{font-family:"Instrument Sans",Arial,sans-serif;fill:#263B36}.title{font-size:22px;font-weight:600;letter-spacing:-.5px}.label{font-size:14px;font-weight:600}.small{font-size:12px;fill:#5D6C65}.data{font-size:17px;font-variant-numeric:tabular-nums}.line{fill:none;stroke:#32776B;stroke-width:2;stroke-linecap:round}.trace{stroke-dasharray:900;stroke-dashoffset:0;animation:trace 1.8s cubic-bezier(.22,1,.36,1) both}.settle{animation:settle .7s cubic-bezier(.22,1,.36,1) both}.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}.d4{animation-delay:.6s}.emphasize{animation:emphasis 1.2s ease both}.bar{transform-box:fill-box;transform-origin:left center;animation:bar .8s ease both}@keyframes trace{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}@keyframes settle{from{transform:translateY(14px)}to{transform:translateY(0)}}@keyframes emphasis{from{stroke-width:0}to{stroke-width:2}}@keyframes bar{from{transform:scaleX(.08)}to{transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><text x="34" y="42" class="title">A draft awaits its owner</text><text x="34" y="66" class="small">DEMO / ILLUSTRATIVE · concept preview</text><g class="settle"><rect x="42" y="136" width="252" height="200" rx="10" fill="#FFF" stroke="#D5DED7"/><text x="62" y="170" class="label">Exception</text><text x="62" y="199" class="small">TX-091 / CE-21</text><text x="62" y="224" class="small">Wrong entity / state</text><rect x="58" y="293" width="220" height="27" rx="4" fill="#F7E8E4"/><text x="67" y="311" class="small" style="fill:#9D3B31">Hold remains</text></g><path d="M294 230H340" class="line trace"/><g class="settle d1"><rect x="341" y="110" width="310" height="265" rx="10" fill="#FFF" stroke="#D5DED7"/><text x="361" y="144" class="label">Request draft</text><text x="361" y="173" class="small">Confirm legal entity</text><text x="361" y="198" class="small">Provide NY source evidence</text><text x="361" y="223" class="small">Recipient: demo@example.com</text><text x="361" y="248" class="small">Script: approved before outreach</text><rect x="357" y="332" width="278" height="27" rx="4" fill="#F7E8E4"/><text x="366" y="350" class="small" style="fill:#9D3B31">Draft only · not sent</text></g><path d="M651 230H709" class="line trace"/><g class="settle d2"><rect x="709" y="164" width="134" height="164" rx="10" fill="#FFF" stroke="#D5DED7"/><text x="729" y="198" class="label">Tax owner</text><text x="729" y="227" class="small">Review</text><text x="729" y="252" class="small">Approve</text><rect x="725" y="285" width="102" height="27" rx="4" fill="#F7E8E4"/><text x="734" y="303" class="small" style="fill:#9D3B31">Send gated</text></g></svg>
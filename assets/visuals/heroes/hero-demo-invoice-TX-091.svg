<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" role="img" aria-label="The chronology of a correction"><title>The chronology of a correction</title><desc>Source received Apr 10, sale Apr 18, correction Apr 20; CE-21 remains on hold.</desc><style>
text{font-family:"Instrument Sans",Arial,sans-serif;fill:#263B36}.title{font-size:22px;font-weight:600;letter-spacing:-.5px}.label{font-size:14px;font-weight:600}.small{font-size:12px;fill:#5D6C65}.data{font-size:17px;font-variant-numeric:tabular-nums}.line{fill:none;stroke:#32776B;stroke-width:2;stroke-linecap:round}.trace{stroke-dasharray:900;stroke-dashoffset:0;animation:trace 1.8s cubic-bezier(.22,1,.36,1) both}.settle{animation:settle .7s cubic-bezier(.22,1,.36,1) both}.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}.d4{animation-delay:.6s}.emphasize{animation:emphasis 1.2s ease both}.bar{transform-box:fill-box;transform-origin:left center;animation:bar .8s ease both}@keyframes trace{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}@keyframes settle{from{transform:translateY(14px)}to{transform:translateY(0)}}@keyframes emphasis{from{stroke-width:0}to{stroke-width:2}}@keyframes bar{from{transform:scaleX(.08)}to{transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><text x="34" y="42" class="title">The chronology of a correction</text><text x="34" y="66" class="small">DEMO / ILLUSTRATIVE · concept preview</text><path d="M86 183H784" class="line trace"/><circle cx="86" cy="183" r="8" fill="#263B36"/><text x="49" y="225" class="label">Apr 10, 2026</text><text x="49" y="250" class="small">Source received</text><circle cx="431" cy="183" r="8" fill="#B97A50"/><text x="394" y="225" class="label">Apr 18, 2026</text><text x="394" y="250" class="small">Sale TX-091</text><circle cx="776" cy="183" r="8" fill="#263B36"/><text x="739" y="225" class="label">Apr 20, 2026</text><text x="739" y="250" class="small">Reviewer correction</text><g class="settle"><rect x="143" y="296" width="610" height="100" rx="10" fill="#FFF" stroke="#D5DED7"/><text x="163" y="330" class="label">Held for review</text><text x="163" y="359" class="small">Correction rejects a generic expiry inference; entity/state questions remain.</text></g></svg>
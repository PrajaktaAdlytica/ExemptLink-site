<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" role="img" aria-label="Every rule has provenance"><title>Every rule has provenance</title><desc>A form field points to official source, revision and review date.</desc><style>
text{font-family:"Instrument Sans",Arial,sans-serif;fill:#263B36}.title{font-size:22px;font-weight:600;letter-spacing:-.5px}.label{font-size:14px;font-weight:600}.small{font-size:12px;fill:#5D6C65}.data{font-size:17px;font-variant-numeric:tabular-nums}.line{fill:none;stroke:#32776B;stroke-width:2;stroke-linecap:round}.trace{stroke-dasharray:900;stroke-dashoffset:0;animation:trace 1.8s cubic-bezier(.22,1,.36,1) both}.settle{animation:settle .7s cubic-bezier(.22,1,.36,1) both}.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}.d4{animation-delay:.6s}.emphasize{animation:emphasis 1.2s ease both}.bar{transform-box:fill-box;transform-origin:left center;animation:bar .8s ease both}@keyframes trace{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}@keyframes settle{from{transform:translateY(14px)}to{transform:translateY(0)}}@keyframes emphasis{from{stroke-width:0}to{stroke-width:2}}@keyframes bar{from{transform:scaleX(.08)}to{transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><text x="34" y="42" class="title">Every rule has provenance</text><text x="34" y="66" class="small">DEMO / ILLUSTRATIVE · concept preview</text><g class="settle"><rect x="42" y="150" width="268" height="170" rx="10" fill="#FFF" stroke="#D5DED7"/><text x="62" y="184" class="label">Certificate field</text><text x="62" y="213" class="small">Legal entity / state / date</text><text x="62" y="238" class="small">Original document span</text></g><path d="M310 235H398V166H462" class="line trace"/><g class="settle d2"><rect x="462" y="111" width="368" height="286" rx="10" fill="#FFF" stroke="#D5DED7"/><text x="482" y="145" class="label">Source register</text><text x="482" y="174" class="small">Official URL</text><text x="482" y="199" class="small">Form revision / source update</text><text x="482" y="224" class="small">Accessed date is separate</text><text x="482" y="249" class="small">Reviewer and interpretation status</text><text x="482" y="274" class="small">Unknown dates stay unknown</text></g></svg>
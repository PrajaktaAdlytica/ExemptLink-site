<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" role="img" aria-label="An indexed evidence folio"><title>An indexed evidence folio</title><desc>Invoice, certificate and reviewer trail enter a versioned sample index.</desc><style>
text{font-family:"Instrument Sans",Arial,sans-serif;fill:#263B36}.title{font-size:22px;font-weight:600;letter-spacing:-.5px}.label{font-size:14px;font-weight:600}.small{font-size:12px;fill:#5D6C65}.data{font-size:17px;font-variant-numeric:tabular-nums}.line{fill:none;stroke:#32776B;stroke-width:2;stroke-linecap:round}.trace{stroke-dasharray:900;stroke-dashoffset:0;animation:trace 1.8s cubic-bezier(.22,1,.36,1) both}.settle{animation:settle .7s cubic-bezier(.22,1,.36,1) both}.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}.d4{animation-delay:.6s}.emphasize{animation:emphasis 1.2s ease both}.bar{transform-box:fill-box;transform-origin:left center;animation:bar .8s ease both}@keyframes trace{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}@keyframes settle{from{transform:translateY(14px)}to{transform:translateY(0)}}@keyframes emphasis{from{stroke-width:0}to{stroke-width:2}}@keyframes bar{from{transform:scaleX(.08)}to{transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><text x="34" y="42" class="title">An indexed evidence folio</text><text x="34" y="66" class="small">DEMO / ILLUSTRATIVE · concept preview</text><g class="settle d0"><rect x="43" y="121" width="300" height="175" rx="10" fill="#FFF" stroke="#D5DED7"/><text x="63" y="155" class="label">Invoice TX-091</text><text x="63" y="184" class="small">Original source preserved</text><text x="63" y="209" class="small">Version and timestamp recorded</text></g><g class="settle d1"><rect x="86" y="149" width="300" height="175" rx="10" fill="#FFF" stroke="#D5DED7"/><text x="106" y="183" class="label">Candidate CE-21</text><text x="106" y="212" class="small">Original source preserved</text><text x="106" y="237" class="small">Version and timestamp recorded</text></g><g class="settle d2"><rect x="129" y="177" width="300" height="175" rx="10" fill="#FFF" stroke="#D5DED7"/><text x="149" y="211" class="label">Reviewer correction</text><text x="149" y="240" class="small">Original source preserved</text><text x="149" y="265" class="small">Version and timestamp recorded</text></g><path d="M428 276H505V220H540" class="line trace"/><g class="settle d3"><rect x="541" y="114" width="299" height="283" rx="10" fill="#FFF" stroke="#D5DED7"/><text x="561" y="148" class="label">Sample packet / illustrative</text><text x="561" y="177" class="small">01 Transaction source</text><text x="561" y="202" class="small">02 Certificate version</text><text x="561" y="227" class="small">03 Correspondence trail</text><text x="561" y="252" class="small">04 Reviewer decisions</text><text x="561" y="277" class="small">05 Unresolved appendix</text></g><text x="43" y="435" class="small">Immutability is a proposed requirement, not a claimed production property.</text></svg>
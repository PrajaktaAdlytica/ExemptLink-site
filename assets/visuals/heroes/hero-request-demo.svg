<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" role="img" aria-label="A concept you can inspect"><title>A concept you can inspect</title><desc>A three-frame specimen shows record, evidence and correction for a guided conversation.</desc><style>
text{font-family:"Instrument Sans",Arial,sans-serif;fill:#263B36}.title{font-size:22px;font-weight:600;letter-spacing:-.5px}.label{font-size:14px;font-weight:600}.small{font-size:12px;fill:#5D6C65}.data{font-size:17px;font-variant-numeric:tabular-nums}.line{fill:none;stroke:#32776B;stroke-width:2;stroke-linecap:round}.trace{stroke-dasharray:900;stroke-dashoffset:0;animation:trace 1.8s cubic-bezier(.22,1,.36,1) both}.settle{animation:settle .7s cubic-bezier(.22,1,.36,1) both}.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}.d4{animation-delay:.6s}.emphasize{animation:emphasis 1.2s ease both}.bar{transform-box:fill-box;transform-origin:left center;animation:bar .8s ease both}@keyframes trace{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}@keyframes settle{from{transform:translateY(14px)}to{transform:translateY(0)}}@keyframes emphasis{from{stroke-width:0}to{stroke-width:2}}@keyframes bar{from{transform:scaleX(.08)}to{transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><text x="34" y="42" class="title">A concept you can inspect</text><text x="34" y="66" class="small">DEMO / ILLUSTRATIVE · concept preview</text><g class="settle d2"><rect x="370" y="113" width="439" height="282" rx="10" fill="#FFF" stroke="#D5DED7"/><text x="390" y="147" class="label">Guided concept walkthrough</text><text x="390" y="176" class="small">Inspect a record</text><text x="390" y="201" class="small">Inspect evidence</text><text x="390" y="226" class="small">Inspect the correction</text></g><rect x="44" y="135" width="170" height="112" rx="7" fill="#E8EFEB" stroke="#81948A" class="settle d0"/><text x="57" y="173" class="label">Record</text><rect x="114" y="177" width="170" height="112" rx="7" fill="#F1E9DD" stroke="#81948A" class="settle d1"/><text x="127" y="215" class="label">Evidence</text><rect x="184" y="219" width="170" height="112" rx="7" fill="#EDEAF2" stroke="#81948A" class="settle d2"/><text x="197" y="257" class="label">Correction</text></svg>
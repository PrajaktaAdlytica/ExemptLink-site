<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" role="img" aria-label="A queue opens one case"><title>A queue opens one case</title><desc>A sample queue selects TX-091 and exposes its held evidence relationship.</desc><style>
text{font-family:"Instrument Sans",Arial,sans-serif;fill:#263B36}.title{font-size:22px;font-weight:600;letter-spacing:-.5px}.label{font-size:14px;font-weight:600}.small{font-size:12px;fill:#5D6C65}.data{font-size:17px;font-variant-numeric:tabular-nums}.line{fill:none;stroke:#32776B;stroke-width:2;stroke-linecap:round}.trace{stroke-dasharray:900;stroke-dashoffset:0;animation:trace 1.8s cubic-bezier(.22,1,.36,1) both}.settle{animation:settle .7s cubic-bezier(.22,1,.36,1) both}.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}.d4{animation-delay:.6s}.emphasize{animation:emphasis 1.2s ease both}.bar{transform-box:fill-box;transform-origin:left center;animation:bar .8s ease both}@keyframes trace{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}@keyframes settle{from{transform:translateY(14px)}to{transform:translateY(0)}}@keyframes emphasis{from{stroke-width:0}to{stroke-width:2}}@keyframes bar{from{transform:scaleX(.08)}to{transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><text x="34" y="42" class="title">A queue opens one case</text><text x="34" y="66" class="small">DEMO / ILLUSTRATIVE · concept preview</text><g class="settle"><rect x="40" y="111" width="285" height="298" rx="10" fill="#FFF" stroke="#D5DED7"/><text x="60" y="145" class="label">Synthetic sample queue</text><text x="60" y="174" class="small">TX-091 / held</text><text x="60" y="199" class="small">TX-092 / pending</text><text x="60" y="224" class="small">TX-093 / held</text><text x="60" y="249" class="small">TX-094 / reviewed</text><text x="60" y="274" class="small">TX-095 / unknown</text><text x="60" y="299" class="small">10 records / USD 16,000</text></g><path d="M325 179H397" class="line trace"/><g class="settle d2"><rect x="398" y="151" width="430" height="231" rx="10" fill="#FFF" stroke="#D5DED7"/><text x="418" y="185" class="label">Opened TX-091</text><text x="418" y="214" class="small">Invoice → candidate CE-21</text><text x="418" y="239" class="small">Buyer entity and state differ</text><text x="418" y="264" class="small">Accountant correction recorded</text><text x="418" y="289" class="small">Next action: approved-script draft</text><rect x="414" y="339" width="398" height="27" rx="4" fill="#F7E8E4"/><text x="423" y="357" class="small" style="fill:#9D3B31">Hold remains</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" role="img" aria-label="Three populations, one difference"><title>Three populations, one difference</title><desc>Illustrative GL $16,000, engine $15,100 and sample $16,000 reveal a $900 population difference.</desc><style>
text{font-family:"Instrument Sans",Arial,sans-serif;fill:#263B36}.title{font-size:22px;font-weight:600;letter-spacing:-.5px}.label{font-size:14px;font-weight:600}.small{font-size:12px;fill:#5D6C65}.data{font-size:17px;font-variant-numeric:tabular-nums}.line{fill:none;stroke:#32776B;stroke-width:2;stroke-linecap:round}.trace{stroke-dasharray:900;stroke-dashoffset:0;animation:trace 1.8s cubic-bezier(.22,1,.36,1) both}.settle{animation:settle .7s cubic-bezier(.22,1,.36,1) both}.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}.d4{animation-delay:.6s}.emphasize{animation:emphasis 1.2s ease both}.bar{transform-box:fill-box;transform-origin:left center;animation:bar .8s ease both}@keyframes trace{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}@keyframes settle{from{transform:translateY(14px)}to{transform:translateY(0)}}@keyframes emphasis{from{stroke-width:0}to{stroke-width:2}}@keyframes bar{from{transform:scaleX(.08)}to{transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><text x="34" y="42" class="title">Three populations, one difference</text><text x="34" y="66" class="small">DEMO / ILLUSTRATIVE · concept preview</text><text x="40" y="131" class="label">GL population</text><rect class="bar d0" x="215" y="113" width="535" height="30" rx="4" fill="#263B36"/><text x="766" y="131" class="data">$16,000</text><text x="40" y="211" class="label">Engine population</text><rect class="bar d1" x="215" y="193" width="505" height="30" rx="4" fill="#B97A50"/><text x="766" y="211" class="data">$15,100</text><text x="40" y="291" class="label">Evidence sample</text><rect class="bar d2" x="215" y="273" width="535" height="30" rx="4" fill="#32776B"/><text x="766" y="291" class="data">$16,000</text><g class="settle"><rect x="215" y="355" width="568" height="76" rx="10" fill="#FFF" stroke="#D5DED7"/><text x="235" y="389" class="label">Difference USD 900 / needs review</text><text x="235" y="418" class="small">Synthetic TX-096 absent from the engine export. No recovered-money claim.</text></g></svg>
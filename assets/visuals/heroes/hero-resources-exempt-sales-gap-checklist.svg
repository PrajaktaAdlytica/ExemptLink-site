<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" role="img" aria-label="A practical sample-review sheet"><title>A practical sample-review sheet</title><desc>Numbered questions reveal source, state, entity and current-vendor coverage.</desc><style>
text{font-family:"Instrument Sans",Arial,sans-serif;fill:#263B36}.title{font-size:22px;font-weight:600;letter-spacing:-.5px}.label{font-size:14px;font-weight:600}.small{font-size:12px;fill:#5D6C65}.data{font-size:17px;font-variant-numeric:tabular-nums}.line{fill:none;stroke:#32776B;stroke-width:2;stroke-linecap:round}.trace{stroke-dasharray:900;stroke-dashoffset:0;animation:trace 1.8s cubic-bezier(.22,1,.36,1) both}.settle{animation:settle .7s cubic-bezier(.22,1,.36,1) both}.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}.d4{animation-delay:.6s}.emphasize{animation:emphasis 1.2s ease both}.bar{transform-box:fill-box;transform-origin:left center;animation:bar .8s ease both}@keyframes trace{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}@keyframes settle{from{transform:translateY(14px)}to{transform:translateY(0)}}@keyframes emphasis{from{stroke-width:0}to{stroke-width:2}}@keyframes bar{from{transform:scaleX(.08)}to{transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><text x="34" y="42" class="title">A practical sample-review sheet</text><text x="34" y="66" class="small">DEMO / ILLUSTRATIVE · concept preview</text><g class="settle"><rect x="40" y="113" width="355" height="274" rx="10" fill="#FFF" stroke="#D5DED7"/><text x="60" y="147" class="label">NY checklist / source questions</text><text x="60" y="176" class="small">Entity name and address</text><text x="60" y="201" class="small">Required identifier</text><text x="60" y="226" class="small">Signed field where required</text><text x="60" y="251" class="small">Correct state/form and purchase use</text><text x="60" y="276" class="small">Receipt date and source version</text></g><path d="M395 187H460V160H495" class="line trace"/><g class="settle d2"><rect x="495" y="119" width="342" height="235" rx="10" fill="#FFF" stroke="#D5DED7"/><text x="515" y="153" class="label">Official source / informational</text><text x="515" y="182" class="small">NY TB-ST-240</text><text x="515" y="207" class="small">Updated Jan 21, 2026</text><text x="515" y="232" class="small">Blanket period: do not invent expiry</text><text x="515" y="257" class="small">Field status: missing / unknown</text><rect x="511" y="311" width="310" height="27" rx="4" fill="#F7E8E4"/><text x="520" y="329" class="small" style="fill:#9D3B31">Tax owner reviews interpretation</text></g><text x="42" y="420" class="label">01 Scope   02 Trace   03 Compare existing alerts   04 Review</text></svg>
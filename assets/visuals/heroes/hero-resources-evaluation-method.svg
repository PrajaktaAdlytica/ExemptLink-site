<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" role="img" aria-label="Incremental value is the question"><title>Incremental value is the question</title><desc>Baseline alerts and reviewed findings occupy separate lanes, with new gaps still unknown.</desc><style>
text{font-family:"Instrument Sans",Arial,sans-serif;fill:#263B36}.title{font-size:22px;font-weight:600;letter-spacing:-.5px}.label{font-size:14px;font-weight:600}.small{font-size:12px;fill:#5D6C65}.data{font-size:17px;font-variant-numeric:tabular-nums}.line{fill:none;stroke:#32776B;stroke-width:2;stroke-linecap:round}.trace{stroke-dasharray:900;stroke-dashoffset:0;animation:trace 1.8s cubic-bezier(.22,1,.36,1) both}.settle{animation:settle .7s cubic-bezier(.22,1,.36,1) both}.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}.d4{animation-delay:.6s}.emphasize{animation:emphasis 1.2s ease both}.bar{transform-box:fill-box;transform-origin:left center;animation:bar .8s ease both}@keyframes trace{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}@keyframes settle{from{transform:translateY(14px)}to{transform:translateY(0)}}@keyframes emphasis{from{stroke-width:0}to{stroke-width:2}}@keyframes bar{from{transform:scaleX(.08)}to{transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><text x="34" y="42" class="title">Incremental value is the question</text><text x="34" y="66" class="small">DEMO / ILLUSTRATIVE · concept preview</text><g class="settle"><rect x="40" y="132" width="340" height="216" rx="10" fill="#FFF" stroke="#D5DED7"/><text x="60" y="166" class="label">Existing process</text><text x="60" y="195" class="small">Suite alerts / configuration</text><text x="60" y="220" class="small">Baseline review effort</text><text x="60" y="245" class="small">Previously known gaps</text></g><g class="settle"><rect x="502" y="167" width="328" height="216" rx="10" fill="#FFF" stroke="#D5DED7"/><text x="522" y="201" class="label">Reviewed sample</text><text x="522" y="230" class="small">Tax-owner ground truth</text><text x="522" y="255" class="small">New / known / uncertain</text><text x="522" y="280" class="small">Remediation effort</text></g><path d="M380 244H501" class="line trace"/><text x="41" y="418" class="label">Buyer-confirmed incremental gaps and a funded pilot determine the decision.</text></svg>
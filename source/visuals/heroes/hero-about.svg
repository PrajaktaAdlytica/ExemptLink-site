<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" role="img" aria-label="The ExemptLink symbol"><title>The ExemptLink symbol</title><desc>A three-part brand symbol. Its open seam represents a reviewable link between source evidence, jurisdiction and a human reviewer.</desc><style>
text{font-family:"Instrument Sans",Arial,sans-serif;fill:#263B36}.title{font-size:22px;font-weight:600;letter-spacing:-.5px}.label{font-size:14px;font-weight:600}.small{font-size:12px;fill:#5D6C65}.data{font-size:17px;font-variant-numeric:tabular-nums}.line{fill:none;stroke:#32776B;stroke-width:2;stroke-linecap:round}.trace{stroke-dasharray:900;stroke-dashoffset:0;animation:trace 1.8s cubic-bezier(.22,1,.36,1) both}.settle{animation:settle .7s cubic-bezier(.22,1,.36,1) both}.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}.d4{animation-delay:.6s}.emphasize{animation:emphasis 1.2s ease both}.bar{transform-box:fill-box;transform-origin:left center;animation:bar .8s ease both}@keyframes trace{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}@keyframes settle{from{transform:translateY(14px)}to{transform:translateY(0)}}@keyframes emphasis{from{stroke-width:0}to{stroke-width:2}}@keyframes bar{from{transform:scaleX(.08)}to{transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><text x="34" y="42" class="title">The ExemptLink symbol</text><text x="34" y="66" class="small">BRAND ILLUSTRATION · concept preview</text><g transform="translate(94 126) scale(.91)"><g class="settle"><path fill="#263B36" d="M1.02,0.00 L119.87,0.00 L119.87,81.27 L70.10,94.48 L58.92,118.86 L0.00,118.86 Z"/><path fill="#263B36" d="M0.00,136.13 L57.90,136.13 L88.38,168.63 L139.17,171.68 L161.52,243.81 L0.00,243.81 Z"/><path fill="#32776B" d="M138.16,0.00 L194.03,1.02 L232.63,35.56 L234.67,35.56 L239.75,41.65 L241.78,41.65 L246.86,47.75 L256.00,53.84 L256.00,243.81 L178.79,243.81 L155.43,170.67 L155.43,156.44 L95.49,152.38 L73.14,129.02 L81.27,107.68 L86.35,107.68 L89.40,105.65 L136.13,94.48 Z"/></g></g><text x="414" y="180" class="title">Evidence, in its place.</text><text x="414" y="220" class="label">A source. A jurisdiction. A reviewer.</text><text x="414" y="267" class="small">The open seam represents a reviewable connection.</text><text x="414" y="299" class="small">Research-stage company concept.</text></svg>
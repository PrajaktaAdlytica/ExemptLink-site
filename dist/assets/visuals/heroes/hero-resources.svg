<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" role="img" aria-label="The evidence reading room"><title>The evidence reading room</title><desc>Source guides, checklist and evaluation method become an indexed reading shelf.</desc><style>
text{font-family:"Instrument Sans",Arial,sans-serif;fill:#263B36}.title{font-size:22px;font-weight:600;letter-spacing:-.5px}.label{font-size:14px;font-weight:600}.small{font-size:12px;fill:#5D6C65}.data{font-size:17px;font-variant-numeric:tabular-nums}.line{fill:none;stroke:#32776B;stroke-width:2;stroke-linecap:round}.trace{stroke-dasharray:900;stroke-dashoffset:0;animation:trace 1.8s cubic-bezier(.22,1,.36,1) both}.settle{animation:settle .7s cubic-bezier(.22,1,.36,1) both}.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}.d4{animation-delay:.6s}.emphasize{animation:emphasis 1.2s ease both}.bar{transform-box:fill-box;transform-origin:left center;animation:bar .8s ease both}@keyframes trace{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}@keyframes settle{from{transform:translateY(14px)}to{transform:translateY(0)}}@keyframes emphasis{from{stroke-width:0}to{stroke-width:2}}@keyframes bar{from{transform:scaleX(.08)}to{transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><text x="34" y="42" class="title">The evidence reading room</text><text x="34" y="66" class="small">DEMO / ILLUSTRATIVE · concept preview</text><g class="settle d0"><rect x="44" y="123" width="239" height="230" rx="10" fill="#FFF" stroke="#D5DED7"/><text x="64" y="157" class="label">Gap checklist</text><text x="64" y="186" class="small">Practical sample questions</text><text x="64" y="211" class="small">Dated and source-linked</text><text x="64" y="236" class="small">Informational / proposed</text></g><g class="settle d1"><rect x="307" y="161" width="239" height="230" rx="10" fill="#FFF" stroke="#D5DED7"/><text x="327" y="195" class="label">Official sources</text><text x="327" y="224" class="small">Jurisdiction and version</text><text x="327" y="249" class="small">Dated and source-linked</text><text x="327" y="274" class="small">Informational / proposed</text></g><g class="settle d2"><rect x="570" y="123" width="239" height="230" rx="10" fill="#FFF" stroke="#D5DED7"/><text x="590" y="157" class="label">Evaluation method</text><text x="590" y="186" class="small">Baseline versus reviewed</text><text x="590" y="211" class="small">Dated and source-linked</text><text x="590" y="236" class="small">Informational / proposed</text></g></svg>
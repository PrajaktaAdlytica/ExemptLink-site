<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" role="img" aria-label="The scope of this concept"><title>The scope of this concept</title><desc>A scope bracket distinguishes concept preview, proposed pilot and future agreement.</desc><style>
text{font-family:"Instrument Sans",Arial,sans-serif;fill:#263B36}.title{font-size:22px;font-weight:600;letter-spacing:-.5px}.label{font-size:14px;font-weight:600}.small{font-size:12px;fill:#5D6C65}.data{font-size:17px;font-variant-numeric:tabular-nums}.line{fill:none;stroke:#32776B;stroke-width:2;stroke-linecap:round}.trace{stroke-dasharray:900;stroke-dashoffset:0;animation:trace 1.8s cubic-bezier(.22,1,.36,1) both}.settle{animation:settle .7s cubic-bezier(.22,1,.36,1) both}.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}.d4{animation-delay:.6s}.emphasize{animation:emphasis 1.2s ease both}.bar{transform-box:fill-box;transform-origin:left center;animation:bar .8s ease both}@keyframes trace{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}@keyframes settle{from{transform:translateY(14px)}to{transform:translateY(0)}}@keyframes emphasis{from{stroke-width:0}to{stroke-width:2}}@keyframes bar{from{transform:scaleX(.08)}to{transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><text x="34" y="42" class="title">The scope of this concept</text><text x="34" y="66" class="small">DEMO / ILLUSTRATIVE · concept preview</text><path d="M60 112v58h18" class="line trace d0"/><text x="95" y="138" class="label">01 / Concept preview</text><text x="95" y="161" class="small">Read the actual terms; do not infer an operating service.</text><path d="M60 193v58h18" class="line trace d1"/><text x="95" y="219" class="label">02 / Proposed pilot</text><text x="95" y="242" class="small">Read the actual terms; do not infer an operating service.</text><path d="M60 274v58h18" class="line trace d2"/><text x="95" y="300" class="label">03 / Human review</text><text x="95" y="323" class="small">Read the actual terms; do not infer an operating service.</text><path d="M60 355v58h18" class="line trace d3"/><text x="95" y="381" class="label">04 / Future agreement</text><text x="95" y="404" class="small">Read the actual terms; do not infer an operating service.</text></svg>
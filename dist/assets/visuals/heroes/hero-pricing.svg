<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" role="img" aria-label="A proposal with a clear boundary"><title>A proposal with a clear boundary</title><desc>A scope schedule reveals the $2,000 pilot hypothesis and later recurring-price hypothesis.</desc><style>
text{font-family:"Instrument Sans",Arial,sans-serif;fill:#263B36}.title{font-size:22px;font-weight:600;letter-spacing:-.5px}.label{font-size:14px;font-weight:600}.small{font-size:12px;fill:#5D6C65}.data{font-size:17px;font-variant-numeric:tabular-nums}.line{fill:none;stroke:#32776B;stroke-width:2;stroke-linecap:round}.trace{stroke-dasharray:900;stroke-dashoffset:0;animation:trace 1.8s cubic-bezier(.22,1,.36,1) both}.settle{animation:settle .7s cubic-bezier(.22,1,.36,1) both}.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}.d4{animation-delay:.6s}.emphasize{animation:emphasis 1.2s ease both}.bar{transform-box:fill-box;transform-origin:left center;animation:bar .8s ease both}@keyframes trace{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}@keyframes settle{from{transform:translateY(14px)}to{transform:translateY(0)}}@keyframes emphasis{from{stroke-width:0}to{stroke-width:2}}@keyframes bar{from{transform:scaleX(.08)}to{transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><text x="34" y="42" class="title">A proposal with a clear boundary</text><text x="34" y="66" class="small">DEMO / ILLUSTRATIVE · concept preview</text><g class="settle"><rect x="44" y="117" width="447" height="281" rx="10" fill="#FFF" stroke="#D5DED7"/><text x="64" y="151" class="label">Bounded audit-prep pilot</text><text x="64" y="180" class="small">Scope: 100 historical sales</text><text x="64" y="205" class="small">State: one agreed jurisdiction</text><text x="64" y="230" class="small">Workflow: one selected offer</text><text x="64" y="255" class="small">Output: reviewed evidence questions</text></g><g class="settle d2"><rect x="541" y="150" width="284" height="181" rx="10" fill="#FFF" stroke="#D5DED7"/><text x="561" y="184" class="label">USD 2,000</text><text x="561" y="213" class="small">Hypothetical test price</text><text x="561" y="238" class="small">Subject to scope and buyer decision</text><rect x="557" y="288" width="252" height="27" rx="4" fill="#F7E8E4"/><text x="566" y="306" class="small" style="fill:#9D3B31">No checkout</text></g><path d="M491 224H540" class="line trace"/><text x="542" y="376" class="label">Later recurring hypothesis:</text><text x="542" y="401" class="small">USD 600–2,000/month / entity-state cluster</text></svg>
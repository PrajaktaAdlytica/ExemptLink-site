<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" role="img" aria-label="Three responsibilities, one record"><title>Three responsibilities, one record</title><desc>Tax lead, controller and adviser connect to evidence through distinct responsibilities.</desc><style>
text{font-family:"Instrument Sans",Arial,sans-serif;fill:#263B36}.title{font-size:22px;font-weight:600;letter-spacing:-.5px}.label{font-size:14px;font-weight:600}.small{font-size:12px;fill:#5D6C65}.data{font-size:17px;font-variant-numeric:tabular-nums}.line{fill:none;stroke:#32776B;stroke-width:2;stroke-linecap:round}.trace{stroke-dasharray:900;stroke-dashoffset:0;animation:trace 1.8s cubic-bezier(.22,1,.36,1) both}.settle{animation:settle .7s cubic-bezier(.22,1,.36,1) both}.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}.d4{animation-delay:.6s}.emphasize{animation:emphasis 1.2s ease both}.bar{transform-box:fill-box;transform-origin:left center;animation:bar .8s ease both}@keyframes trace{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}@keyframes settle{from{transform:translateY(14px)}to{transform:translateY(0)}}@keyframes emphasis{from{stroke-width:0}to{stroke-width:2}}@keyframes bar{from{transform:scaleX(.08)}to{transform:scaleX(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style><text x="34" y="42" class="title">Three responsibilities, one record</text><text x="34" y="66" class="small">DEMO / ILLUSTRATIVE · concept preview</text><g class="settle d0"><rect x="42" y="110" width="285" height="82" rx="10" fill="#FFF" stroke="#D5DED7"/><text x="62" y="144" class="label">Tax lead</text><text x="62" y="173" class="small">Classify true gaps</text></g><path d="M327 151H421V252H500" class="line trace"/><g class="settle d1"><rect x="42" y="210" width="285" height="82" rx="10" fill="#FFF" stroke="#D5DED7"/><text x="62" y="244" class="label">Controller</text><text x="62" y="273" class="small">Review period differences</text></g><path d="M327 251H421V252H500" class="line trace"/><g class="settle d2"><rect x="42" y="310" width="285" height="82" rx="10" fill="#FFF" stroke="#D5DED7"/><text x="62" y="344" class="label">Adviser</text><text x="62" y="373" class="small">Interpret source evidence</text></g><path d="M327 351H421V252H500" class="line trace"/><g class="settle"><rect x="500" y="174" width="325" height="164" rx="10" fill="#FFF" stroke="#D5DED7"/><text x="520" y="208" class="label">One reviewable record</text><text x="520" y="237" class="small">Transaction / certificate / source</text><text x="520" y="262" class="small">Owner and next action</text><text x="520" y="287" class="small">Decision reason retained</text></g></svg>